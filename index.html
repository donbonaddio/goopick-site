<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goopick — coming soon</title>
<meta name="description" content="Goopick — guess what the goo becomes before it finishes forming. A fast, friendly guessing game. Coming soon.">
<meta property="og:title" content="Goopick — coming soon">
<meta property="og:description" content="Guess what the goo becomes before it finishes forming. The sooner you spot it, the more you score. Coming soon.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235EDC3C'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%230a0a0a'/%3E%3C/svg%3E">
<style>
  :root { --lime: #5edc3c; --bg: #0a0a0a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    min-height: 100%;
    overflow: hidden;
  }
  .blob {
    width: 150px;
    height: 150px;
    background: var(--lime);
    margin-bottom: 2.5rem;
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
    animation: goo 6s ease-in-out infinite;
    box-shadow: 0 0 60px rgba(94, 220, 60, 0.35);
  }
  @keyframes goo {
    0%,100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: rotate(0deg) scale(1); }
    33%     { border-radius: 67% 33% 40% 60% / 58% 61% 39% 42%; transform: rotate(8deg) scale(1.05); }
    66%     { border-radius: 38% 62% 56% 44% / 63% 39% 61% 37%; transform: rotate(-6deg) scale(0.97); }
  }
  h1 {
    font-size: clamp(3rem, 14vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--lime);
    line-height: 1;
  }
  .tagline {
    margin-top: 1.1rem;
    font-size: clamp(1.05rem, 4.5vw, 1.4rem);
    font-weight: 500;
    color: #c7cdd4;
    max-width: 22ch;
  }
  .badge {
    margin-top: 2.2rem;
    display: inline-block;
    padding: 0.6rem 1.3rem;
    border: 1.5px solid var(--lime);
    border-radius: 999px;
    color: var(--lime);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0; right: 0;
    font-size: 0.85rem;
    color: #6b7178;
  }
  footer a { color: #9aa0a8; text-decoration: none; }
  footer a:hover { color: var(--lime); }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
</style>
</head>
<body>
  <div class="blob" aria-hidden="true"></div>
  <h1>GOOPICK</h1>
  <p class="tagline">Guess what the goo becomes &mdash; before it finishes forming.</p>
  <span class="badge">Coming soon</span>
  <footer>A <a href="https://donstech.com">donstech</a> app</footer>
</body>
</html>
